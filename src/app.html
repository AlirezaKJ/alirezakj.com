<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#eff7f2" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#14242a" media="(prefers-color-scheme: dark)" />
		<link
			rel="preload"
			href="/fonts/hanken-grotesk-variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<link
			rel="preload"
			href="/fonts/grenze-variable.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		/>
		<script>
			// Apply a stored theme choice before first paint; otherwise the CSS
			// falls back to the system preference. Keep in sync with layout.css.
			try {
				const t = localStorage.getItem('theme');
				if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
